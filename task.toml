version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "unknown"
category = "software-engineering"
subcategories = ["tool_specific", "api_integration"]
# codebase_size: 25 source files in environment/ (small = 20+)
codebase_size = "small"
languages = ["rego", "python", "bash"]
tags = ["opa", "imagemagick", "escape-room", "policy-as-code"]
expert_time_estimate_min = 90
junior_time_estimate_min = 180
number_of_milestones = 0

[verifier]
# Oracle + verifier runs in ~10 s; 180 s gives ample margin for cold starts
timeout_sec = 180.0

[agent]
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
